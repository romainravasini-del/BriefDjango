{% extends "base.html" %}
{% load static %}
{% block content %}


<h1 class="text-5xl font-bold text-slate-800 text-center">Bienvenue à l'Association Multisports de l'Aisne</h1>
<div class="max-w-3xl mx-auto py-10 px-6">
<p class="text-slate-500 text-center mt-2 mb-8">Veuillez vous connecter pour accéder à votre compte. </p>
<div class="grid grid-cols-1 md:grid-cols-2 gap-8">
<section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">

            <h2 class="text-2xl font-bold text-slate-800 text-center mb-6">Connexion</h2>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" name="action" value="connexion" class="mt-4 w-full bg-sky-400 hover:bg-sky-500 text-white font-semibold py-2 px-4 rounded-lg transition">Se connecter
                </button>
            </form>
        </section>

        <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <h2 class="text-2xl font-bold text-slate-800 text-center mb-6">Inscription</h2>
            <form method="post">
                {% csrf_token %}
                {{inscription_form.as_p }}
                <button type="submit" name="action" value="inscription" class="mt-4 w-full bg-sky-400 hover:bg-sky-500 text-white font-semibold py-2 px-4 rounded-lg transition">S'inscrire
                </button>
            </form>
        </section>
    </div>
    </div>

    {% endblock %}
